name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Build Frontend
      run: |
        cd client
        npm install
        npm run build

    - name: Prepare Deployment Folder
      run: |
        mkdir -p deploy_package/client
        cp -r client/dist deploy_package/client/dist
        cp -r server deploy_package/server
        
    - name: Copy files via SCP to Hostinger
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.HOSTINGER_HOST }}
        username: ${{ secrets.HOSTINGER_USERNAME }}
        password: ${{ secrets.HOSTINGER_PASSWORD }}
        port: ${{ secrets.HOSTINGER_PORT }}
        source: "deploy_package/*"
        target: "/var/www/frango-na-brasa"
        strip_components: 1

    - name: Restart PM2 and Install Backend Deps
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOSTINGER_HOST }}
        username: ${{ secrets.HOSTINGER_USERNAME }}
        password: ${{ secrets.HOSTINGER_PASSWORD }}
        port: ${{ secrets.HOSTINGER_PORT }}
        script: |
          cd /var/www/frango-na-brasa/server
          echo "PORT=3005" > .env
          echo "PAGARME_SECRET_KEY=sk_80d5ebf0e3534b628e9d596cccc014a8" >> .env
          npm install
          pm2 restart frango-backend || pm2 start index.js --name "frango-backend"
          pm2 save
          
          # Configura o Nginx para apontar para o React (Frontend) e o Node (Backend)
          sudo tee /etc/nginx/sites-available/frango-na-brasa << 'EOF'
          server {
              listen 80;
              server_name 187.127.44.246;
              root /var/www/frango-na-brasa/client/dist;
              index index.html;
              location / {
                  try_files $uri $uri/ /index.html;
              }
              location /api/ {
                  proxy_pass http://localhost:3005;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $host;
                  proxy_cache_bypass $http_upgrade;
              }
          }
          EOF
          sudo ln -sf /etc/nginx/sites-available/frango-na-brasa /etc/nginx/sites-enabled/
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo chown -R www-data:www-data /var/www/frango-na-brasa
          sudo chmod -R 755 /var/www/frango-na-brasa
          sudo systemctl reload nginx
